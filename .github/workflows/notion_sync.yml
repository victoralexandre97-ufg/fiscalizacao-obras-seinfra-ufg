name: Sincronização Notion -> Dashboard SEINFRA

on:
  schedule:
    # Executa a cada 6 horas
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  # Também publica no Pages quando há push direto na main
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-notion:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.git_check.outputs.changed }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup do Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalação das dependências
        run: pip install requests

      - name: Executa fetch_notion.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python scripts/fetch_notion.py

      - name: Verifica alterações em dados.json
        id: git_check
        run: |
          if git diff --quiet -- dados.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit e push automático
        if: steps.git_check.outputs.changed == 'true'
        run: |
          git config user.name "seinfra-notion-bot"
          git config user.email "actions@github.com"
          git add dados.json
          git commit -m "chore: sincroniza dados.json com o Notion [skip ci]"
          git push

  deploy-pages:
    needs: sync-notion
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout do código (branch atualizada)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configura o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload do artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
